name: Build Test APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-debug:
    name: Android Test APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Create temporary test signing config
        # Tests must pass before producing a new APK.
        shell: bash
        run: |
          cat > android/keystore.properties <<'EOF'
          storeFile=debug.keystore
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

      - name: Privacy regression checks
        run: npm run test:privacy

      - name: Car layout and interaction regression checks
        run: npm run test:car-ui

      - name: GD music source regression checks
        run: npm run test:gd-studio

      - name: Build standalone car APK
        shell: bash
        run: |
          cd android
          ./gradlew assembleCarRelease

      - name: Upload standalone car APK
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-car-test-${{ github.sha }}
          path: android/app/build/outputs/apk/car/release/*universal.apk
          if-no-files-found: error

      - name: Publish test pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="test-v${VERSION}-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "LX Music 车机测试版 v${VERSION} (${GITHUB_RUN_NUMBER})" \
            --notes "新增可选 GD音乐台（网易云·在线播放），支持 128k、320k 和无损请求；请在设置中手动选择。原有搜索、歌单、同步、车机布局及右侧系统窗口策略保持不变。GD 当前禁止下载，其他允许下载的音源不受影响。测试签名 universal APK 内置 JavaScript bundle，无需 Metro；尚需实车验证。详见仓库 docs/GD_STUDIO.md。" \
            android/app/build/outputs/apk/car/release/*universal.apk

      - name: Publish stable release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$VERSION"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "LX Music 车机版 v${VERSION}" \
            --generate-notes \
            android/app/build/outputs/apk/car/release/*universal.apk
